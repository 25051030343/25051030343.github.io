<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>三层嵌套盒子 | 黄紫渐变模糊背景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #F9E45B, #D96CFF, #B77CFF, #F4D03F, #C154FF);
            background-size: 300% 300%;
            animation: yellowPurpleFlow 16s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            padding: 32px;
            position: relative;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(10px);
            z-index: -2;
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 15, 45, 0.2);
            z-index: -1;
        }
        
        @keyframes yellowPurpleFlow {
            0% {
                background-position: 0% 30%;
            }
            33% {
                background-position: 60% 70%;
            }
            66% {
                background-position: 100% 40%;
            }
            100% {
                background-position: 0% 30%;
            }
        }
        
        .box-level-1 {
            width: 520px;
            height: 520px;
            background-color: #2D7AFF;
            border-radius: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25), inset 0 1px 2px rgba(255,255,255,0.3);
        }
        
        .box-level-2 {
            width: 440px;
            height: 260px;
            background-color: #FFFFFF;
            border-radius: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }
        
        .box-level-3 {
            width: 360px;
            height: 180px;
            background-color: #FF79C6;
            border-radius: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.1);
        }
        
        .center-white-circle {
            width: 98px;
            height: 98px;
            background-color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .left-triangle {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 32px 44px 32px 0;
            border-color: transparent #3C2B6E transparent transparent;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }
        
        @media (max-width: 620px) {
            .box-level-1 {
                width: 360px;
                height: 360px;
                border-radius: 36px;
            }
            .box-level-2 {
                width: 300px;
                height: 180px;
                border-radius: 28px;
            }
            .box-level-3 {
                width: 240px;
                height: 120px;
            }
            .center-white-circle {
                width: 70px;
                height: 70px;
            }
            .left-triangle {
                border-width: 22px 32px 22px 0;
            }
        }
        
        .bg-glow {
            position: fixed;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,80,0.1) 0%, rgba(165,70,220,0.15) 80%);
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="box-level-1">
        <div class="box-level-2">
            <div class="box-level-3">
                <div class="center-white-circle">
                    <div class="left-triangle"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bg-glow"></div>
</body>
</html>
