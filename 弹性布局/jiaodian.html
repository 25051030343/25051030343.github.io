<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>弹性布局焦点图效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        .carousel-container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 28px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
        }

        .banner-wrapper {
            position: relative;
            width: 616px;
            margin: 0 auto;
        }

        .main-banner {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            user-select: none;
            pointer-events: none;
        }

        .arrow-left, .arrow-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 49px;
            height: 49px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            z-index: 10;
        }

        .arrow-left {
            left: -25px;
        }

        .arrow-right {
            right: -25px;
        }

        .arrow-left:hover, .arrow-right:hover {
            transform: translateY(-50%) scale(1.08);
            opacity: 0.85;
        }

        .points-area {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .point-item {
            width: 12px;
            height: 11px;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .point-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 680px) {
            .banner-wrapper {
                width: 100%;
                max-width: 616px;
            }
            .arrow-left {
                left: -12px;
            }
            .arrow-right {
                right: -12px;
            }
        }
    </style>
</head>
<body>
<div class="carousel-container">
    <div class="banner-wrapper">
        <img class="main-banner" src="banner1.jpg" alt="focus banner" draggable="false">

        <img class="arrow-left" src="arrow1.png" alt="left arrow" draggable="false">
        <img class="arrow-right" src="arrow2.png" alt="right arrow" draggable="false">

        <div class="points-area" id="pointsArea"></div>
    </div>
</div>

<script>
    (function() {
        const totalPoints = 4;
        let activeIndex = 0;

        const pointsArea = document.getElementById('pointsArea');
        const leftArrow = document.querySelector('.arrow-left');
        const rightArrow = document.querySelector('.arrow-right');

        function buildPoints() {
            pointsArea.innerHTML = '';
            for (let i = 0; i < totalPoints; i++) {
                const pointDiv = document.createElement('div');
                pointDiv.className = 'point-item';
                const img = document.createElement('img');
                if (i === activeIndex) {
                    img.src = 'point2.png';
                } else {
                    img.src = 'point1.png';
                }
                img.alt = 'indicator';
                pointDiv.appendChild(img);
                pointsArea.appendChild(pointDiv);
            }
        }

        function updatePointsUI() {
            const allPoints = pointsArea.querySelectorAll('.point-item');
            for (let i = 0; i < allPoints.length; i++) {
                const imgElement = allPoints[i].querySelector('img');
                if (i === activeIndex) {
                    imgElement.src = 'point2.png';
                } else {
                    imgElement.src = 'point1.png';
                }
            }
        }

        function moveLeft() {
            if (activeIndex > 0) {
                activeIndex--;
                updatePointsUI();
            }
        }

        function moveRight() {
            if (activeIndex < totalPoints - 1) {
                activeIndex++;
                updatePointsUI();
            }
        }

        leftArrow.addEventListener('click', moveLeft);
        rightArrow.addEventListener('click', moveRight);

        buildPoints();
    })();
</script>
</body>
</html>
